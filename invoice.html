<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Maker — Bidder Experts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root {
  --lime:#2D9B3A; --lime-bright:#4FC95A; --lime-light:rgba(45,155,58,0.1);
  --dark:#0A1A0C; --card:#FFFFFF; --card2:#F4F8F4;
  --border:rgba(45,155,58,0.2); --text:#2A3A2C; --muted:#6A8A6E; --white:#F0F5F0;
  --teal:#1A9B7A; --amber:#D4820A; --red:#D63B3B;
  --sidebar-bg:#0D1F0F; --sidebar-text:#E8F5E9; --sidebar-muted:#5A7A5E;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:#F0F7F0;color:var(--text);overflow-x:hidden;}

/* Animated background */
.bg-grid{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(135deg,#F0F7F0 0%,#E8F5E9 50%,#F0F7F0 100%);
  pointer-events:none;
}
.bg-grid::before{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(45,155,58,0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(45,155,58,0.06) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridFloat 20s ease-in-out infinite alternate;
}
@keyframes gridFloat{0%{transform:translate(0,0)}100%{transform:translate(4px,-4px)}}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.orb1{width:600px;height:600px;background:radial-gradient(circle,rgba(45,155,58,0.15),transparent 70%);top:-200px;right:-100px;animation:orbDrift 12s ease-in-out infinite alternate;}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(26,155,122,0.1),transparent 70%);bottom:-100px;left:-100px;animation:orbDrift 16s ease-in-out infinite alternate-reverse;}
.orb3{width:300px;height:300px;background:radial-gradient(circle,rgba(212,130,10,0.08),transparent 70%);top:50%;left:50%;animation:orbDrift 20s ease-in-out infinite;}
@keyframes orbDrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-20px) scale(1.1)}}

/* LAYOUT */
.app{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:320px 1fr;gap:0;animation:appFadeIn 0.5s ease both;}
@keyframes appFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* SIDEBAR — dark green, premium */
.sidebar{
  background:var(--sidebar-bg);
  border-right:1px solid rgba(255,255,255,0.06);
  padding:24px 20px;overflow-y:auto;
  height:100vh;position:sticky;top:0;
  box-shadow:4px 0 40px rgba(0,0,0,0.3);
}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-logo-icon{width:38px;height:38px;background:rgba(79,201,90,0.15);border:1px solid rgba(79,201,90,0.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:12px;font-weight:800;color:#4FC95A;}
.sidebar-logo-text{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:#E8F5E9;}
.sidebar-logo-sub{font-size:10px;color:var(--sidebar-muted);}

/* FORM in sidebar */
.form-section{margin-bottom:22px;}
.form-section-title{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#4FC95A;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.form-section-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.form-row.single{grid-template-columns:1fr;}
.form-group{display:flex;flex-direction:column;gap:4px;}
label{font-size:10px;color:var(--sidebar-muted);text-transform:uppercase;letter-spacing:0.8px;}
input,select,textarea{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 10px;color:#E8F5E9;font-family:'DM Sans',sans-serif;font-size:12px;outline:none;transition:all 0.2s;width:100%;}
input:focus,select:focus,textarea:focus{border-color:rgba(79,201,90,0.5);background:rgba(255,255,255,0.09);}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.2);}
select option{background:#0D1F0F;color:#E8F5E9;}
textarea{resize:vertical;min-height:60px;}

/* Color swatches */
.color-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;}
.color-swatch{width:100%;aspect-ratio:1;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all 0.2s;}
.color-swatch.active{border-color:#fff;transform:scale(1.12);box-shadow:0 0 10px rgba(255,255,255,0.3);}
.color-swatch:hover{transform:scale(1.08);}
.template-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.template-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 6px;cursor:pointer;text-align:center;font-size:10px;color:var(--sidebar-muted);transition:all 0.2s;font-family:'DM Sans',sans-serif;}
.template-btn:hover{background:rgba(79,201,90,0.1);border-color:rgba(79,201,90,0.3);color:#4FC95A;}
.template-btn.active{background:rgba(79,201,90,0.12);border-color:rgba(79,201,90,0.4);color:#4FC95A;}

/* Items table in sidebar */
.items-table{width:100%;border-collapse:collapse;margin-bottom:8px;}
.items-table th{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--sidebar-muted);padding:6px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.07);}
.items-table td{padding:4px 4px;}
.items-table input{padding:6px 8px;border-radius:6px;font-size:11px;}
.items-table .del-btn{background:none;border:none;color:#FF5C5C;cursor:pointer;font-size:14px;padding:4px;opacity:0.5;transition:opacity 0.2s;}
.items-table .del-btn:hover{opacity:1;}
.add-item-btn{width:100%;background:rgba(79,201,90,0.06);border:1px dashed rgba(79,201,90,0.3);border-radius:8px;padding:8px;color:#4FC95A;font-size:11px;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif;margin-bottom:8px;}
.add-item-btn:hover{background:rgba(79,201,90,0.12);}

/* Action buttons */
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}
.btn{padding:10px 16px;border-radius:10px;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;border:none;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:#4FC95A;color:#0A1A0C;}
.btn-primary:hover{background:#3DB84A;box-shadow:0 4px 16px rgba(79,201,90,0.4);}
.btn-ghost{background:transparent;border:1px solid rgba(79,201,90,0.35);color:#4FC95A;}
.btn-ghost:hover{background:rgba(79,201,90,0.1);}
.btn-full{grid-column:span 2;}
.btn-email{background:linear-gradient(135deg,#4285F4,#34A853);color:#fff;box-shadow:0 2px 12px rgba(66,133,244,0.3);}
.btn-email:hover{box-shadow:0 4px 20px rgba(66,133,244,0.5);}
.btn-wa{background:#25D366;color:#fff;box-shadow:0 2px 12px rgba(37,211,102,0.3);}
.btn-wa:hover{box-shadow:0 4px 20px rgba(37,211,102,0.5);}

/* Payment toggles in sidebar */
.pay-methods{display:flex;flex-direction:column;gap:8px;}
.pay-toggle{cursor:pointer;}
.pay-toggle input[type="checkbox"]{display:none;}
.pay-card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 12px;transition:all 0.2s;position:relative;}
.pay-toggle input:checked + .pay-card{background:rgba(79,201,90,0.08);border-color:rgba(79,201,90,0.35);}
.pay-bank-logo{width:44px;height:36px;border-radius:8px;border:1px solid;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-align:center;padding:2px;}
.pay-details{flex:1;min-width:0;}
.pay-bank-name{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:#E8F5E9;margin-bottom:2px;}
.pay-acc{font-family:'JetBrains Mono',monospace;font-size:10px;color:#4FC95A;}
.pay-iban{font-size:9px;color:var(--sidebar-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pay-check{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;flex-shrink:0;transition:all 0.2s;}
.pay-toggle input:checked + .pay-card .pay-check{background:#4FC95A;border-color:#4FC95A;color:#0A1A0C;}

/* PREVIEW PANEL */
.preview-panel{padding:32px 40px;overflow-y:auto;height:100vh;background:transparent;}
.preview-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.preview-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:#1A3A1C;}
.preview-badge{background:rgba(45,155,58,0.12);border:1px solid rgba(45,155,58,0.25);border-radius:20px;padding:4px 12px;font-size:10px;color:#2D9B3A;font-weight:600;display:flex;align-items:center;gap:5px;}
.preview-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:#4FC95A;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* INVOICE PAPER — white with beautiful shadows */
.invoice-paper{
  background:#FFFFFF;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 4px 6px rgba(0,0,0,0.04),
    0 10px 20px rgba(0,0,0,0.06),
    0 30px 60px rgba(0,0,0,0.08),
    0 0 0 1px rgba(0,0,0,0.03);
  max-width:720px;
  margin:0 auto;
  min-height:900px;
  transform:translateY(0);
  transition:transform 0.3s ease,box-shadow 0.3s ease;
  animation:paperSlideIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes paperSlideIn{
  from{opacity:0;transform:translateY(20px) scale(0.99);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.invoice-paper:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 12px rgba(0,0,0,0.05),
    0 20px 40px rgba(0,0,0,0.08),
    0 50px 80px rgba(0,0,0,0.1),
    0 0 0 1px rgba(0,0,0,0.03);
}

/* TEMPLATE 1 — DARK LUXURY */
.tpl-luxury .inv-header{background:#0A0E0A;padding:40px 48px;display:flex;justify-content:space-between;align-items:flex-start;}
.tpl-luxury .inv-brand{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent-color);letter-spacing:1px;}
.tpl-luxury .inv-tagline{font-size:11px;color:#4A6A4A;margin-top:3px;}
.tpl-luxury .inv-meta{text-align:right;}
.tpl-luxury .inv-number{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;color:#fff;letter-spacing:1px;}
.tpl-luxury .inv-number-label{font-size:10px;color:#4A6A4A;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.tpl-luxury .inv-status{display:inline-block;background:color-mix(in srgb, var(--accent-color) 15%, transparent);border:1px solid color-mix(in srgb, var(--accent-color) 30%, transparent);border-radius:20px;padding:3px 12px;font-size:10px;color:var(--accent-color);font-weight:700;margin-top:6px;}
.tpl-luxury .inv-body{padding:36px 48px;}
.tpl-luxury .inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:32px;}
.tpl-luxury .inv-party-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#999;margin-bottom:8px;font-family:'Syne',sans-serif;}
.tpl-luxury .inv-party-name{font-size:16px;font-weight:700;color:#111;margin-bottom:4px;font-family:'Syne',sans-serif;}
.tpl-luxury .inv-party-detail{font-size:12px;color:#555;line-height:1.6;}
.tpl-luxury .inv-dates{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:#F8F9F8;border-radius:10px;padding:16px 20px;margin-bottom:28px;}
.tpl-luxury .inv-date-item{}
.tpl-luxury .inv-date-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#999;margin-bottom:3px;}
.tpl-luxury .inv-date-val{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:#111;}
.tpl-luxury .inv-table{width:100%;border-collapse:collapse;margin-bottom:24px;}
.tpl-luxury .inv-table th{background:#0A0E0A;color:var(--accent-color);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;padding:12px 16px;text-align:left;font-family:'Syne',sans-serif;}
.tpl-luxury .inv-table th:last-child{text-align:right;}
.tpl-luxury .inv-table td{padding:12px 16px;font-size:13px;color:#333;border-bottom:1px solid #F0F0F0;}
.tpl-luxury .inv-table td:last-child{text-align:right;font-weight:600;}
.tpl-luxury .inv-table tr:last-child td{border-bottom:none;}
.tpl-luxury .inv-totals{margin-left:auto;width:260px;}
.tpl-luxury .inv-total-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;color:#555;border-bottom:1px solid #F0F0F0;}
.tpl-luxury .inv-total-row.grand{
  background:linear-gradient(135deg,#0A0E0A 0%,#182818 100%);
  border:2px solid var(--accent-color);border-radius:14px;
  padding:13px 18px;margin-top:8px;
  font-family:'Syne',sans-serif;font-size:14px;font-weight:800;
  color:#fff;border-bottom:none;
  box-shadow:0 6px 24px rgba(0,0,0,0.2);
  display:flex;justify-content:space-between;align-items:center;
}
.tpl-luxury .inv-total-row.grand span:first-child{
  color:rgba(255,255,255,0.65);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:2px;
}
.tpl-luxury .inv-total-row.grand span:last-child{
  color:var(--accent-color);font-size:20px;font-weight:800;filter:none;
}
.tpl-luxury .inv-notes{background:#F8F9F8;border-left:3px solid var(--accent-color);padding:16px 20px;border-radius:0 8px 8px 0;margin-top:24px;font-size:12px;color:#555;line-height:1.6;}
.tpl-luxury .inv-footer{background:#0A0E0A;padding:20px 48px;display:flex;justify-content:space-between;align-items:center;}
.tpl-luxury .inv-footer-text{font-size:11px;color:#4A6A4A;}
.tpl-luxury .inv-footer-brand{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--accent-color);}

/* TEMPLATE 2 — CLEAN WHITE */
.tpl-clean .inv-header{padding:40px 48px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;}
.tpl-clean .inv-brand{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#111;letter-spacing:-0.5px;}
.tpl-clean .inv-accent-line{width:40px;height:3px;background:var(--accent-color,var(--accent-color));margin-top:6px;border-radius:2px;}
.tpl-clean .inv-tagline{font-size:11px;color:#888;margin-top:4px;}
.tpl-clean .inv-meta{text-align:right;}
.tpl-clean .inv-number{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:600;color:#111;}
.tpl-clean .inv-number-label{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.tpl-clean .inv-status{display:inline-block;background:var(--accent-color,var(--accent-color));color:#111;border-radius:20px;padding:3px 12px;font-size:10px;font-weight:700;margin-top:6px;}
.tpl-clean .inv-body{padding:36px 48px;}
.tpl-clean .inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:32px;}
.tpl-clean .inv-party-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent-color,var(--accent-color));margin-bottom:8px;font-family:'Syne',sans-serif;font-weight:700;}
.tpl-clean .inv-party-name{font-size:16px;font-weight:700;color:#111;margin-bottom:4px;font-family:'Syne',sans-serif;}
.tpl-clean .inv-party-detail{font-size:12px;color:#666;line-height:1.6;}
.tpl-clean .inv-dates{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;}
.tpl-clean .inv-date-item{border-top:2px solid var(--accent-color,var(--accent-color));padding-top:8px;}
.tpl-clean .inv-date-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#999;margin-bottom:3px;}
.tpl-clean .inv-date-val{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:#111;}
.tpl-clean .inv-table{width:100%;border-collapse:collapse;margin-bottom:24px;}
.tpl-clean .inv-table th{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;padding:10px 0;text-align:left;color:#999;border-bottom:1px solid #111;font-family:'Syne',sans-serif;}
.tpl-clean .inv-table th:last-child{text-align:right;}
.tpl-clean .inv-table td{padding:14px 0;font-size:13px;color:#333;border-bottom:1px solid #EEE;}
.tpl-clean .inv-table td:last-child{text-align:right;font-weight:600;}
.tpl-clean .inv-totals{margin-left:auto;width:240px;}
.tpl-clean .inv-total-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:#666;border-bottom:1px solid #EEE;}
.tpl-clean .inv-total-row.grand{
  background:linear-gradient(135deg,#F6FFF6 0%,#EBF8EB 100%);
  border:2px solid var(--accent-color);border-radius:12px;
  padding:13px 18px;margin-top:8px;
  font-family:'Syne',sans-serif;font-size:14px;font-weight:800;
  color:#111;border-bottom:none;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
  display:flex;justify-content:space-between;align-items:center;
}
.tpl-clean .inv-total-row.grand span:first-child{
  color:#666;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:2px;
}
.tpl-clean .inv-total-row.grand span:last-child{
  color:var(--accent-color);font-size:20px;font-weight:800;filter:brightness(0.8);
}
.tpl-clean .inv-notes{border-left:3px solid var(--accent-color,var(--accent-color));padding:14px 18px;margin-top:24px;font-size:12px;color:#666;line-height:1.6;}
.tpl-clean .inv-footer{padding:20px 48px;border-top:1px solid #EEE;display:flex;justify-content:space-between;align-items:center;}
.tpl-clean .inv-footer-text{font-size:11px;color:#999;}
.tpl-clean .inv-footer-brand{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:#111;}

/* TEMPLATE 3 — BOLD GRADIENT */
.tpl-bold .inv-header{padding:40px 48px;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;justify-content:space-between;align-items:flex-start;}
.tpl-bold .inv-brand{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#fff;letter-spacing:1px;}
.tpl-bold .inv-tagline{font-size:11px;color:rgba(255,255,255,0.4);margin-top:3px;}
.tpl-bold .inv-meta{text-align:right;}
.tpl-bold .inv-number{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;color:var(--accent-color,var(--accent-color));}
.tpl-bold .inv-number-label{font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.tpl-bold .inv-status{display:inline-block;background:var(--accent-color,var(--accent-color));color:#111;border-radius:4px;padding:3px 10px;font-size:10px;font-weight:700;margin-top:6px;}
.tpl-bold .inv-body{padding:36px 48px;}
.tpl-bold .inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-bottom:32px;}
.tpl-bold .inv-party-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#999;margin-bottom:8px;font-weight:700;}
.tpl-bold .inv-party-name{font-size:16px;font-weight:700;color:#111;margin-bottom:4px;font-family:'Syne',sans-serif;}
.tpl-bold .inv-party-detail{font-size:12px;color:#555;line-height:1.6;}
.tpl-bold .inv-dates{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;background:linear-gradient(135deg,#f8f9ff,#f0f4ff);border-radius:10px;padding:16px 20px;}
.tpl-bold .inv-date-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#999;margin-bottom:3px;}

/* ============ INVOICE-WIDE ANIMATIONS ============ */
.invoice-paper {
  animation: invPaperLift 0.7s cubic-bezier(0.34,1.2,0.5,1);
}
@keyframes invPaperLift {
  0% { opacity:0; transform:translateY(20px) scale(0.98); }
  100% { opacity:1; transform:translateY(0) scale(1); }
}
/* table rows fade in stacked */
.inv-table tbody tr {
  animation: invRowIn 0.5s ease backwards;
}
.inv-table tbody tr:nth-child(1) { animation-delay: 0.15s; }
.inv-table tbody tr:nth-child(2) { animation-delay: 0.22s; }
.inv-table tbody tr:nth-child(3) { animation-delay: 0.29s; }
.inv-table tbody tr:nth-child(4) { animation-delay: 0.36s; }
.inv-table tbody tr:nth-child(5) { animation-delay: 0.43s; }
.inv-table tbody tr:nth-child(n+6) { animation-delay: 0.5s; }
@keyframes invRowIn {
  0% { opacity:0; transform:translateX(-12px); }
  100% { opacity:1; transform:translateX(0); }
}
/* grand total subtle pulse glow */
.inv-total-row.grand {
  animation: invGrandIn 0.6s cubic-bezier(0.34,1.5,0.5,1) 0.4s backwards;
}
@keyframes invGrandIn {
  0% { opacity:0; transform:scale(0.94); }
  60% { transform:scale(1.03); }
  100% { opacity:1; transform:scale(1); }
}
/* status badge pulse for UNPAID / OVERDUE */
.inv-status[data-status="UNPAID"],
.inv-status[data-status="OVERDUE"] {
  animation: invStatusPulse 2.2s ease-in-out infinite;
}
@keyframes invStatusPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(214,59,59,0); }
  50% { box-shadow: 0 0 0 6px rgba(214,59,59,0.12); }
}
/* number ticker for grand total */
.inv-total-row.grand span:last-child { font-variant-numeric: tabular-nums; }
/* parties fade-in */
.inv-parties > div {
  animation: invFadeUp 0.5s ease 0.25s backwards;
}
.inv-parties > div:nth-child(2) { animation-delay: 0.32s; }
@keyframes invFadeUp {
  0% { opacity:0; transform:translateY(8px); }
  100% { opacity:1; transform:translateY(0); }
}
/* dates animation */
.inv-dates .inv-date-item, .inv-dates > div {
  animation: invFadeUp 0.5s ease 0.4s backwards;
}
/* notes slide in */
.inv-notes {
  animation: invFadeUp 0.5s ease 0.55s backwards;
}

.inv-total-divider {
  height:1px;background:rgba(0,0,0,0.1);margin:8px 0 4px;
}

  .inv-pay-now::before {
    content:''; position:absolute; top:0; left:-100%; width:50%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition:left 0.5s ease;

  .inv-brand-row { display:flex; align-items:center; gap:14px; animation:invFadeUp 0.5s ease 0.15s backwards; }

  .inv-brand-text { display:flex; flex-direction:column; gap:2px; min-width:0; }
  /* dark templates: subtle light plate so the logo (often dark-bg) doesn't clash */
  .tpl-luxury .inv-logo-wrap,

  .tpl-clean .inv-logo,

  /* ===== PAID rubber stamp ===== */
  .invoice-paper { position:relative; }
  .inv-stamp {
    position:absolute; top:140px; right:60px; z-index:5;
    border:5px solid #1aaa3b; color:#1aaa3b;
    font-family:'Syne',sans-serif; font-weight:800; font-size:34px; letter-spacing:3px;
    padding:10px 22px; border-radius:8px;
    transform:rotate(-12deg) scale(0); opacity:0;
    text-transform:uppercase;
    box-shadow:0 0 0 3px rgba(26,170,59,0.15) inset;
    pointer-events:none;
    animation:invStampIn 0.7s cubic-bezier(0.34,1.6,0.5,1) 0.5s forwards;
  }
  .inv-stamp::before {
    content:''; position:absolute; inset:-2px; border-radius:8px;
    background:radial-gradient(circle at 30% 30%, transparent 25%, rgba(255,255,255,0.4) 28%, transparent 31%);
    pointer-events:none;
  }
  .inv-stamp-overdue { color:#d63b3b; border-color:#d63b3b; box-shadow:0 0 0 3px rgba(214,59,59,0.15) inset; }
  .inv-stamp-partial { color:#d4820a; border-color:#d4820a; box-shadow:0 0 0 3px rgba(212,130,10,0.15) inset; }
  @keyframes invStampIn {
    0% { transform:rotate(-30deg) scale(2.5); opacity:0; }
    60% { transform:rotate(-8deg) scale(0.9); opacity:1; }
    100% { transform:rotate(-12deg) scale(1); opacity:0.85; }
  }
  .profile-select-inp option { background: #0D120D; color: #F0F5F0; }
  /* fromPerson field highlight */
  #fromPerson { color: #F0F5F0 !important; font-weight: 600; }
  #fromName   { color: #B8FF3C !important; font-weight: 700; }
</style>

<script>
var items = [
  { desc: 'Upwork Account Management & Bidding (Monthly)', qty: 1, rate: 250 },
  { desc: 'Proposal Writing & Lead Generation', qty: 30, rate: 5 },
  { desc: 'Profile Optimization & JSS Maintenance', qty: 1, rate: 100 }
];

var currentTemplate = 'luxury';
var currentAccent = 'lime';

// Set today and +14 days as defaults
(function() {
  var today = new Date();
  var due = new Date(); due.setDate(due.getDate() + 14);
  document.getElementById('invDate').value = today.toISOString().split('T')[0];
  document.getElementById('dueDate').value = due.toISOString().split('T')[0];
})();

function addItem() {
  items.push({ desc: '', qty: 1, rate: 0 });
  renderItems();
  render();
}

function removeItem(i) {
  items.splice(i, 1);
  renderItems();
  render();
}

function updateItem(i, field, val) {
  items[i][field] = field === 'desc' ? val : parseFloat(val) || 0;
  render();
}

function renderItems() {
  var tbody = document.getElementById('itemsBody');
  tbody.innerHTML = items.map(function(item, i) {
    return '<tr>' +
      '<td><input value="' + escHtml(item.desc) + '" placeholder="Description" style="width:100%" oninput="updateItem(' + i + ',\'desc\',this.value)"></td>' +
      '<td><input type="number" value="' + item.qty + '" min="0" style="width:52px" oninput="updateItem(' + i + ',\'qty\',this.value)"></td>' +
      '<td><input type="number" value="' + item.rate + '" min="0" style="width:70px" oninput="updateItem(' + i + ',\'rate\',this.value)"></td>' +
      '<td><button class="del-btn" onclick="removeItem(' + i + ')">&#10005;</button></td>' +
    '</tr>';
  }).join('');
}

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setTemplate(t) {
  currentTemplate = t;
  document.querySelectorAll('.template-btn').forEach(function(b) {
    b.classList.remove('active');
    if (b.getAttribute('onclick') && b.getAttribute('onclick').indexOf("setTemplate('" + t + "')") !== -1) {
      b.classList.add('active');
    }
  });
  render();
}

function setAccent(a, el) {
  currentAccent = a;
  document.querySelectorAll('.color-swatch').forEach(function(s) { s.classList.remove('active'); });
  el.classList.add('active');
  // Update CSS variable on document root so inline styles can access it
  var colors = {lime:'#B8FF3C',blue:'#4285F4',teal:'#5DCAA5',amber:'#F5A623',purple:'#9B59B6'};
  document.documentElement.style.setProperty('--accent-color', colors[a] || '#B8FF3C');
  render();
}

function getVal(id) { return document.getElementById(id).value || ''; }

function fmt(n) {
  var sym = getVal('currency') || '$';
  var num = parseFloat(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // Add space after multi-char currency codes (PKR, AED, SAR etc.)
  var sep = sym.length > 1 ? ' ' : '';
  return sym + sep + num;
}

function fmtDate(d) {
  if (!d) return '';
  var parts = d.split('-');
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(parts[1])-1] + ' ' + parts[2] + ', ' + parts[0];
}

function calcTotals() {
  var subtotal = items.reduce(function(s, item) { return s + (item.qty * item.rate); }, 0);
  var discPct  = parseFloat(getVal('discRate')) || 0;
  var taxPct   = parseFloat(getVal('taxRate')) || 0;
  var discount = subtotal * discPct / 100;
  var taxable  = subtotal - discount;
  var tax      = taxable * taxPct / 100;
  var total    = taxable + tax;
  return { subtotal, discount, discPct, tax, taxPct, total };
}

/* ============ BRANDING: LOGO + SIGNATURE (persisted) ============ */
var BRAND_KEYS = { logo: 'beInvLogo', sig: 'beInvSig' };
function handleBrandUpload(ev, kind) {
  var file = ev.target.files && ev.target.files[0];
  if (!file) return;
  if (file.size > 800 * 1024) {
    alert('Please use an image under 800 KB for best results.');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    try { localStorage.setItem(BRAND_KEYS[kind], e.target.result); } catch(_) {}
    paintBrandPreviews();
    render();
  };
  reader.readAsDataURL(file);
}
function clearBrand(kind) {
  try { localStorage.removeItem(BRAND_KEYS[kind]); } catch(_) {}
  paintBrandPreviews();
  render();
}
function paintBrandPreviews() {
  var logo = localStorage.getItem(BRAND_KEYS.logo);
  var sig  = localStorage.getItem(BRAND_KEYS.sig);

  var sp = document.getElementById('sigPreview');
  if (lp) lp.innerHTML = logo ? '<img src="' + logo + '" alt="logo">' : '<span class="brand-up-hint">+ Upload</span>';
  if (sp) sp.innerHTML = sig  ? '<img src="' + sig  + '" alt="signature">' : '<span class="brand-up-hint">+ Upload</span>';
}
function getBrand(kind) {

/* ============ SAVED INVOICE TEMPLATES ============ */
var TPL_KEY = 'beInvTemplates';
function getInvSnapshot() {
  return {
    fromName: getVal('fromName'), fromPerson: getVal('fromPerson'),
    fromEmail: getVal('fromEmail'), fromPhone: getVal('fromPhone'),
    fromAddress: getVal('fromAddress'),
    toName: getVal('toName'), toEmail: getVal('toEmail'),
    toPhone: getVal('toPhone'), toAddress: getVal('toAddress'),
    currency: getVal('currency'), taxRate: getVal('taxRate'),
    discRate: getVal('discRate'), platform: getVal('platform'),
    notes: getVal('notes'), template: currentTemplate, accent: currentAccent,
    items: items.slice()
  };
}
function applyInvSnapshot(s) {
  ['fromName','fromPerson','fromEmail','fromPhone','fromAddress','toName','toEmail','toPhone','toAddress','currency','taxRate','discRate','platform','notes'].forEach(function(k){
    var el = document.getElementById(k);
    if (el && s[k] !== undefined) el.value = s[k];
  });
  if (s.template) currentTemplate = s.template;
  if (s.accent) currentAccent = s.accent;
  if (s.items && Array.isArray(s.items)) items = s.items.slice();
  renderItems();
  // refresh template + accent active states
  document.querySelectorAll('.template-btn').forEach(function(b){
    b.classList.toggle('active', (b.getAttribute('onclick')||'').indexOf("setTemplate('"+currentTemplate+"')") !== -1);
  });
  render();
}
function loadAllTemplates() {
  try { return JSON.parse(localStorage.getItem(TPL_KEY) || '{}'); } catch(_) { return {}; }
}
function saveAllTemplates(obj) {
  try { localStorage.setItem(TPL_KEY, JSON.stringify(obj)); } catch(_) {}
}
function saveCurrentTemplate() {
  var nameEl = document.getElementById('tplName');
  var name = (nameEl.value || '').trim();
  if (!name) { alert('Please give this template a name.'); return; }
  var all = loadAllTemplates();
  all[name] = getInvSnapshot();
  saveAllTemplates(all);
  nameEl.value = '';
  renderSavedTemplates();
}
function loadSavedTemplate(name) {
  var all = loadAllTemplates();
  if (all[name]) applyInvSnapshot(all[name]);
}
function deleteSavedTemplate(name) {
  if (!confirm('Delete template "' + name + '"?')) return;
  var all = loadAllTemplates();
  delete all[name];
  saveAllTemplates(all);
  renderSavedTemplates();
}
function renderSavedTemplates() {
  var list = document.getElementById('tplSavedList');
  if (!list) return;
  var all = loadAllTemplates();
  var names = Object.keys(all);
  if (!names.length) { list.innerHTML = '<div class="tpl-saved-empty">No saved templates yet.</div>'; return; }
  list.innerHTML = names.map(function(n){
    var safe = n.replace(/"/g,'&quot;');
    return '<div class="tpl-saved-item">' +
      '<span class="tpl-saved-name" onclick="loadSavedTemplate(\'' + safe + '\')" title="Load this template">' + n + '</span>' +
      '<button class="tpl-saved-del" onclick="deleteSavedTemplate(\'' + safe + '\')" title="Delete">&times;</button>' +
    '</div>';
  }).join('');
}

/* ============ PDF DOWNLOAD ============ */
function downloadPDF() {
  // Use the browser's native print engine for PDF generation.
  // Buttons can't be clickable in PDFs (PDFs don't run JS), but ANCHOR LINKS can be.
  // So we clone the invoice and convert each Pay Now <button> into a real <a href="...">
  // pointing at the right URL — these become live, clickable links in the saved PDF.
  var paperEl = document.getElementById('invoicePaper');
  if (!paperEl) return;
  var clone = paperEl.cloneNode(true);

  // Replace each Pay Now button with a real anchor link
  clone.querySelectorAll('.inv-pay-now').forEach(function(btn) {
    var onclick = btn.getAttribute('onclick') || '';
    var keyMatch = onclick.match(/payNow\(['"]([^'"]+)['"]\)/);
    if (!keyMatch) return;
    var key = keyMatch[1];
    var p = (typeof PAYMENTS !== 'undefined') ? PAYMENTS[key] : null;
    if (!p || !p.payUrls) return;
    // Use the desktop URL in the PDF (most common case + works as fallback on mobile too)
    var url = p.payUrls.desktop || p.payUrls.android || p.payUrls.ios;
    if (!url) return;
    var a = document.createElement('a');
    a.className = btn.className;
    a.setAttribute('style', btn.getAttribute('style') || '');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = btn.innerHTML;
    btn.parentNode.replaceChild(a, btn);
  });

  // Make the Payoneer account row a mailto link (it's an email — useful click target in PDF)
  clone.querySelectorAll('.inv-pay-acc').forEach(function(div) {
    var copyVal = div.getAttribute('data-copy') || '';
    if (/@/.test(copyVal)) {
      var a = document.createElement('a');
      a.className = div.className;
      a.setAttribute('style', div.getAttribute('style') || '');
      a.href = 'mailto:' + copyVal;
      a.style.textDecoration = 'none';
      a.style.color = 'inherit';
      a.innerHTML = div.innerHTML;
      div.parentNode.replaceChild(a, div);
    }
  });

  var paperHTML = clone.outerHTML;
  var styles = document.querySelector('style').innerHTML;
  var invNum = (document.getElementById('invNumber').value || 'bidder-experts').replace(/[^a-zA-Z0-9_-]/g,'_');
  var win = window.open('', '_blank');
  if (!win) { alert('Please allow pop-ups for this site to download the PDF.'); return; }
  win.document.title = 'invoice-' + invNum;
  win.document.write(
    '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<title>invoice-' + invNum + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">' +
    '<style>' + styles +
      'body{background:#fff;margin:0;padding:20px;}' +
      '*,*::before,*::after{animation:none !important;transition:none !important;opacity:1 !important;transform:none !important;}' +
      '.inv-stamp{opacity:0.85 !important;transform:rotate(-12deg) !important;}' +
      // make link-style Pay Now buttons look identical to the button version
      'a.inv-pay-now{text-decoration:none;}' +
      '@media print{' +
        'body{padding:0;}' +
        '*{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}' +
        '@page{size:A4;margin:0;}' +
      '}' +
    '<\/style>' +
    '<meta name="robots" content="noindex, nofollow">' +
    '</head><body>' + paperHTML +
    '<scr' + 'ipt>' +
      'window.addEventListener("load",function(){' +
        'setTimeout(function(){window.print();},300);' +
      '});' +
    '</scr' + 'ipt>' +
    '</body></html>'
  );
  win.document.close();
}


function copyInvAcc(el) {
  var v = el.getAttribute('data-copy') || '';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(v).catch(function(){});
  }
  el.classList.add('copied');
  setTimeout(function(){ el.classList.remove('copied'); }, 1400);
}

function detectPayPlatform() {
  var ua = (navigator.userAgent || '').toLowerCase();
  if (/android/.test(ua)) return 'android';
  // iPad on iOS 13+ reports as Mac with touch — catch that
  if (/iphone|ipad|ipod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
  return 'desktop';
}

function payNow(key) {
  var p = PAYMENTS[key]; if (!p) return;
  // 1) silently copy the account to clipboard so it's ready to paste in the app
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { navigator.clipboard.writeText(p.acc); } catch(_) {}
  }
  // 2) briefly flash the matching account row as "copied" for visual feedback
  var rows = document.querySelectorAll('.inv-pay-acc');
  rows.forEach(function(r){
    if ((r.getAttribute('data-copy') || '') === p.acc) {
      r.classList.add('copied');
      setTimeout(function(){ r.classList.remove('copied'); }, 1800);
    }
  });
  // 3) open the right URL for this device (Android app / iOS app / desktop web)
  var platform = detectPayPlatform();
  var url = (p.payUrls && p.payUrls[platform]) || (p.payUrls && p.payUrls.desktop) || p.payUrl;
  if (url) window.open(url, '_blank', 'noopener');
}

        '<span>Secure Payment Methods</span>' +
        '<span class="inv-pay-section-sub">Choose any method below</span>' +
      '</div>' +
      '<div class="inv-pay-grid" style="grid-template-columns:' + cols + ';">' + cards + '</div>' +
      '<div class="inv-pay-foot">Tap <strong>Pay Now</strong> &mdash; we&rsquo;ll copy the account number and open the app for you</div>' +
    '</div>';
}

function getSelectedPaymentText() {
  var selected = [];
  if (document.getElementById('pay-alfalah') && document.getElementById('pay-alfalah').checked) selected.push('alfalah');
  if (document.getElementById('pay-hbl') && document.getElementById('pay-hbl').checked) selected.push('hbl');
  if (document.getElementById('pay-payoneer') && document.getElementById('pay-payoneer').checked) selected.push('payoneer');

}

function render() {
  var t = calcTotals();
  var platform = getVal('platform');
  var paper = document.getElementById('invoicePaper');
  paper.className = 'invoice-paper tpl-' + currentTemplate + ' accent-' + currentAccent;

  var itemRows = items.map(function(item) {
    var lineTotal = item.qty * item.rate;
    return '<tr><td>' + escHtml(item.desc) + '</td><td>' + item.qty + '</td><td>' + fmt(item.rate) + '</td><td>' + fmt(lineTotal) + '</td></tr>';
  }).join('');

  var totalsHtml =
    '<div class="inv-total-row"><span>Subtotal</span><span>' + fmt(t.subtotal) + '</span></div>' +
    (t.discPct > 0 ? '<div class="inv-total-row"><span>Discount (' + t.discPct + '%)</span><span>-' + fmt(t.discount) + '</span></div>' : '') +
    (t.taxPct > 0 ? '<div class="inv-total-row"><span>Tax (' + t.taxPct + '%)</span><span>' + fmt(t.tax) + '</span></div>' : '') +
    '<div class="inv-total-divider"></div>' +
    '<div class="inv-total-row grand"><span>Total Due</span><span>' + fmt(t.total) + '</span></div>';

  var status = getVal('invStatus');

  paper.innerHTML =

    '<div class="inv-header">' +

        '<div class="inv-number-label">Invoice</div>' +

      '<div class="inv-parties">' +
        '<div>' +

          '<div class="inv-party-name">' + escHtml(getVal('fromName')) + '</div>' +

        '</div>' +
        '<div>' +
          '<div class="inv-party-label">Bill To</div>' +
          '<div class="inv-party-name">' + (escHtml(getVal('toName')) || 'Client Name') + '</div>' +

function printInvoice() {
  var paper = document.getElementById('invoicePaper').outerHTML;
  var styles = document.querySelector('style').innerHTML;
  var win = window.open('', '_blank');
  win.document.write(
    '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">' +
    '<style>' + styles + 'body{background:#fff;margin:0;padding:20px;}@media print{body{padding:0;}}<\/style>' +
    '<meta name="robots" content="noindex, nofollow">' +
    '</head><body>' + paper +
    '<scr' + 'ipt>window.onload=function(){window.print();}</scr' + 'ipt>' +
    '</body></html>'
  );
  win.document.close();
}

function downloadHTML() {
  var paper = document.getElementById('invoicePaper').outerHTML;

  var html =
    '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">' +
    '<style>' + styles + 'body{background:#fff;margin:0;padding:20px;}<\/style>' +
    '<meta name="robots" content="noindex, nofollow">' +
    '</head><body>' + paper + '</body></html>';
  var blob = new Blob([html], { type: 'text/html' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'invoice-' + (document.getElementById('invNumber').value || 'bidder-experts') + '.html';
  a.click();
}

  var emailEl   = document.getElementById('fromEmail');
  var phoneEl   = document.getElementById('fromPhone');
  var addressEl = document.getElementById('fromAddress');

  if (addressEl) { addressEl.value = p.address;    }

}
